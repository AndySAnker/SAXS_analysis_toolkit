# Experiment identification
experiment_id: '00001'  # Unique identifier for this experiment
experiment_name: 'regression_test'  # Descriptive name for the experiment

data:
  file_name: "data/simulated/SAXS_dataset_100000.h5"
  num_data_points: 100000
  normalise_data: false
  plot_data: false
  formfactor: 'sphere'

model:
  hyperparameter_optimisation: false
  use_gpu: true
  early_stopping_rounds: 25
  model_save_path: "models/regression/XGBoost_model_{num_data_points}_normData{normalise_data}_earlyStopping{early_stopping_rounds}_hyperparameter{hyperparameter_optimisation}.model"
  class_names_save_path: "models/regression/class_names_{num_data_points}_normData{normalise_data}_earlyStopping{early_stopping_rounds}_hyperparameter{hyperparameter_optimisation}.npy"

evaluation:
  plot_results: false
  plot_confusion_matrix: false

# Verbosity level
verbose: 2
